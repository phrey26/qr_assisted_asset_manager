name: qr_assisted_asset_management
description: A QR-assisted campus asset management application.
publish_to: "none"
version: 1.0.0+1

environment:
  # Pinned to Flutter 3.47 (paired with Dart 3.13, per Flutter's release
  # notes) so `flutter pub get`/`pub upgrade` refuses to resolve against an
  # older Flutter SDK than the app is built and tested against.
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  path_provider: ^2.1.4
  flutter_file_dialog: ^3.3.2
  image_picker: ^1.1.2
  http: ^1.6.0
  shared_preferences: ^2.3.2
  # Camera photo capture + the Windows QR-scanner fallback. mobile_scanner
  # has no Windows implementation, so on Windows the scanner uses `camera`
  # for the preview and decodes frames in Dart with `zxing2` (`image`
  # turns each captured still into pixels for it). `camera` 0.12 dropped
  # its Windows federation, so `camera_windows` is pulled in explicitly to
  # restore it.
  camera: ^0.12.1
  camera_windows: ^0.2.6+5
  zxing2: ^0.2.4
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true